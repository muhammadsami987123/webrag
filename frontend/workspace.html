<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebRAG — Research Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#faf8f4', ink: '#1c1b19', accent: '#1f4b3f' },
        fontFamily: { serif: ['Newsreader', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="h-screen flex flex-col bg-paper text-ink font-sans overflow-hidden">

  <!-- Top bar -->
  <header class="border-b border-[--line] shrink-0 bg-paper z-30">
    <div class="px-4 sm:px-6 py-3 flex items-center gap-3">
      <button id="open-left-drawer" class="lg:hidden min-w-[44px] min-h-[44px] flex items-center justify-center -ml-2 text-[--ink-soft]" aria-label="Open sources panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>

      <a href="/index.html" class="font-serif-edit text-lg tracking-tight shrink-0">WebRAG</a>

      <div class="min-w-0 flex-1 flex items-center gap-2 pl-3 border-l border-[--line]">
        <p id="ws-title" class="text-sm font-medium truncate">Loading workspace…</p>
        <span id="ws-status-badge" class="text-[11px] font-medium px-2 py-0.5 rounded shrink-0"></span>
      </div>

      <div id="ws-stats" class="hidden md:flex items-center gap-4 text-xs text-[--ink-soft] shrink-0"></div>

      <div class="flex items-center gap-2 shrink-0">
        <label class="hidden sm:flex items-center gap-1.5 text-xs text-[--ink-faint] cursor-pointer select-none">
          <input id="debug-toggle" type="checkbox" class="w-3.5 h-3.5 accent-[--accent]" />
          Debug
        </label>
        <button id="reindex-btn" class="text-xs font-medium px-3 py-2 rounded-md border border-[--line-strong] hover:bg-white transition-colors min-h-[44px] sm:min-h-0 sm:py-1.5">
          Re-index
        </button>
        <button id="open-right-drawer" class="lg:hidden min-w-[44px] min-h-[44px] flex items-center justify-center -mr-2 text-[--ink-soft]" aria-label="Open citations panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5v14M13 8h6M13 12h6M13 16h6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="error-banner" class="hidden shrink-0 px-4 py-2.5 bg-[--red-soft] text-[--red] text-sm"></div>

  <!-- Crawl progress view -->
  <div id="progress-view" class="hidden flex-1 overflow-y-auto thin-scroll">
    <div class="max-w-xl mx-auto px-6 py-16">
      <h1 class="font-serif-edit text-2xl mb-1">Building your knowledge base</h1>
      <p id="progress-url" class="text-sm text-[--ink-faint] mb-10 truncate"></p>

      <!-- Stepper -->
      <ol id="stepper" class="flex items-center gap-2 mb-10">
        <!-- populated by JS -->
      </ol>

      <div class="space-y-5">
        <div class="border border-[--line] rounded-md p-4 bg-white">
          <div class="flex justify-between text-sm mb-2">
            <span class="text-[--ink-soft]">Pages discovered</span>
            <span id="stat-discovered" class="font-medium tabular-nums">0</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-[--ink-soft]">Pages processed</span>
            <span id="stat-processed" class="font-medium tabular-nums">0</span>
          </div>
          <div class="mt-2 h-1.5 rounded-full bg-[--line] overflow-hidden">
            <div id="bar-pages" class="progress-fill h-full bg-accent" style="width:0%"></div>
          </div>
        </div>

        <div class="border border-[--line] rounded-md p-4 bg-white">
          <div class="flex justify-between text-sm mb-2">
            <span class="text-[--ink-soft]">Chunks created</span>
            <span id="stat-chunks" class="font-medium tabular-nums">0</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-[--ink-soft]">Embeddings created</span>
            <span id="stat-embeddings" class="font-medium tabular-nums">0</span>
          </div>
          <div class="mt-2 h-1.5 rounded-full bg-[--line] overflow-hidden">
            <div id="bar-embed" class="progress-fill h-full bg-accent" style="width:0%"></div>
          </div>
        </div>
      </div>

      <p id="progress-status-line" class="mt-8 text-sm text-[--ink-faint]">Connecting…</p>
    </div>
  </div>

  <!-- Main three-panel view -->
  <div id="main-view" class="hidden flex-1 min-h-0 relative lg:grid lg:grid-cols-[280px_1fr_320px]">

    <!-- Scrim for mobile drawers -->
    <div id="scrim" class="hidden fixed inset-0 bg-black/30 z-30 lg:hidden"></div>

    <!-- LEFT: Sources / Topics / Notes -->
    <aside id="left-panel"
      class="drawer drawer-hidden-left lg:translate-x-0 fixed lg:static inset-y-0 left-0 z-40 w-[85%] max-w-xs lg:w-auto lg:max-w-none bg-paper border-r border-[--line] flex flex-col min-h-0">
      <div class="flex items-center justify-between px-4 py-3 border-b border-[--line] lg:hidden">
        <p class="text-sm font-medium">Sources & Topics</p>
        <button id="close-left-drawer" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-[--ink-soft]" aria-label="Close">✕</button>
      </div>

      <div class="flex-1 overflow-y-auto thin-scroll px-4 py-4 space-y-6">
        <!-- Scope toggle -->
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-[--ink-faint] mb-2">Question scope</p>
          <div class="flex rounded-md border border-[--line-strong] p-0.5 bg-white text-xs">
            <button id="scope-all" data-scope="all" class="flex-1 py-2 rounded min-h-[36px] font-medium transition-colors">Entire Knowledge Base</button>
            <button id="scope-selected" data-scope="selected" class="flex-1 py-2 rounded min-h-[36px] font-medium transition-colors">Selected Sources</button>
          </div>
        </div>

        <!-- Sources -->
        <div>
          <div class="flex items-baseline justify-between mb-2">
            <p class="text-xs font-semibold uppercase tracking-wide text-[--ink-faint]">Sources</p>
            <p id="sources-count" class="text-xs text-[--ink-faint]"></p>
          </div>
          <div id="sources-list" class="space-y-1"></div>
        </div>

        <!-- Topics -->
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-[--ink-faint] mb-2">Topics</p>
          <div id="topics-list" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- Tabs: Notes / Highlights / Collections -->
        <div>
          <div class="flex border-b border-[--line] text-xs">
            <button data-tab="notes" class="tab-btn px-3 py-2 font-medium border-b-2 border-accent text-ink">Notes</button>
            <button data-tab="highlights" class="tab-btn px-3 py-2 font-medium border-b-2 border-transparent text-[--ink-faint]">Highlights</button>
            <button data-tab="collections" class="tab-btn px-3 py-2 font-medium border-b-2 border-transparent text-[--ink-faint]">Collections</button>
          </div>
          <div id="tab-notes" class="tab-panel pt-3 space-y-2"></div>
          <div id="tab-highlights" class="tab-panel pt-3 space-y-2 hidden"></div>
          <div id="tab-collections" class="tab-panel pt-3 space-y-2 hidden"></div>
        </div>
      </div>
    </aside>

    <!-- CENTER: Conversation -->
    <main class="flex flex-col min-h-0 min-w-0">
      <!-- Mode selector -->
      <div class="border-b border-[--line] px-4 sm:px-6 py-2.5 overflow-x-auto thin-scroll shrink-0">
        <div id="mode-selector" class="inline-flex rounded-md border border-[--line-strong] p-0.5 bg-white text-xs whitespace-nowrap">
          <button data-mode="ask" class="mode-btn px-3 py-1.5 rounded font-medium min-h-[32px]">Ask</button>
          <button data-mode="research" class="mode-btn px-3 py-1.5 rounded font-medium min-h-[32px]">Research</button>
          <button data-mode="compare" class="mode-btn px-3 py-1.5 rounded font-medium min-h-[32px]">Compare</button>
          <button data-mode="summarize" class="mode-btn px-3 py-1.5 rounded font-medium min-h-[32px]">Summarize</button>
          <button data-mode="explain" class="mode-btn px-3 py-1.5 rounded font-medium min-h-[32px]">Explain</button>
          <button data-mode="extract" class="mode-btn px-3 py-1.5 rounded font-medium min-h-[32px]">Extract</button>
        </div>
      </div>

      <!-- Conversation -->
      <div id="conversation" class="flex-1 overflow-y-auto thin-scroll px-4 sm:px-6 py-6 space-y-5"></div>

      <!-- Input -->
      <div class="border-t border-[--line] px-4 sm:px-6 py-4 shrink-0">
        <form id="chat-form" class="flex items-end gap-2">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Ask anything about this website…"
            class="flex-1 resize-none px-3.5 py-3 text-sm rounded-md border border-[--line-strong] bg-white focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent max-h-40"
          ></textarea>
          <button type="submit" id="chat-send" class="px-4 py-3 rounded-md bg-accent text-white text-sm font-medium hover:bg-[--accent-hover] transition-colors disabled:opacity-50 min-h-[44px]">
            Send
          </button>
        </form>
      </div>
    </main>

    <!-- RIGHT: Context / Citations -->
    <aside id="right-panel"
      class="drawer drawer-hidden-right lg:translate-x-0 fixed lg:static inset-y-0 right-0 z-40 w-[85%] max-w-xs lg:w-auto lg:max-w-none bg-paper border-l border-[--line] flex flex-col min-h-0">
      <div class="flex items-center justify-between px-4 py-3 border-b border-[--line] lg:hidden">
        <p class="text-sm font-medium">Context & Citations</p>
        <button id="close-right-drawer" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-[--ink-soft]" aria-label="Close">✕</button>
      </div>
      <div class="hidden lg:block px-4 pt-4 pb-2">
        <p class="text-xs font-semibold uppercase tracking-wide text-[--ink-faint]">Context & Citations</p>
      </div>
      <div id="citations-panel" class="flex-1 overflow-y-auto thin-scroll px-4 py-3 space-y-3">
        <p class="text-sm text-[--ink-faint]">Retrieved sources for the last answer will appear here.</p>
      </div>
    </aside>
  </div>

  <script type="module" src="/js/workspace.js"></script>
</body>
</html>
