<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebRAG — Workspaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#faf8f4', ink: '#1c1b19', accent: '#1f4b3f' },
        fontFamily: { serif: ['Newsreader', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen bg-paper text-ink font-sans">

  <header class="border-b border-[--line]">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-5 flex items-center justify-between">
      <a href="/index.html" class="font-serif-edit text-xl tracking-tight">WebRAG</a>
      <a href="/index.html" class="text-sm text-[--ink-soft] hover:text-ink transition-colors">+ New workspace</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 sm:px-8 py-10">
    <div class="flex items-baseline justify-between mb-8">
      <h1 class="font-serif-edit text-3xl">Workspaces</h1>
      <p id="count-label" class="text-sm text-[--ink-faint]"></p>
    </div>

    <div id="error-banner" class="hidden mb-6 px-4 py-3 rounded-md bg-[--red-soft] text-[--red] text-sm"></div>

    <div id="workspace-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <p class="text-sm text-[--ink-faint]">Loading workspaces…</p>
    </div>
  </main>

  <script type="module" src="/js/workspaces.js"></script>
</body>
</html>
