<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebRAG — Source</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#faf8f4', ink: '#1c1b19', accent: '#1f4b3f' },
        fontFamily: { serif: ['Newsreader', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen bg-paper text-ink font-sans">

  <header class="border-b border-[--line]">
    <div class="max-w-3xl mx-auto px-5 sm:px-8 py-5 flex items-center gap-4">
      <a href="/index.html" class="font-serif-edit text-lg tracking-tight shrink-0">WebRAG</a>
      <span class="text-[--line-strong]">/</span>
      <a id="sources-link" href="#" class="text-sm text-[--ink-soft] hover:text-ink">Sources</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 sm:px-8 py-10">
    <div id="error-banner" class="hidden mb-6 px-4 py-3 rounded-md bg-[--red-soft] text-[--red] text-sm"></div>

    <article id="source-article" class="hidden">
      <p id="src-url" class="text-xs text-[--ink-faint] truncate mb-2"></p>
      <h1 id="src-title" class="font-serif-edit text-3xl leading-tight mb-3"></h1>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-[--ink-faint] mb-6">
        <span id="src-words"></span>
        <span id="src-updated"></span>
        <a id="src-open-original" href="#" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline">Open Original &rarr;</a>
      </div>

      <div id="src-headings" class="mb-8 hidden">
        <p class="text-xs font-semibold uppercase tracking-wide text-[--ink-faint] mb-2">Headings</p>
        <ul id="src-headings-list" class="space-y-1 text-sm text-[--ink-soft]"></ul>
      </div>

      <div id="src-content" class="prose-edit text-[15px] leading-relaxed text-ink space-y-4"></div>
    </article>

    <p id="loading-msg" class="text-sm text-[--ink-faint]">Loading source…</p>
  </main>

  <script type="module" src="/js/source.js"></script>
</body>
</html>
